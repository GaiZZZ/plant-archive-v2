<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef3ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="植物档案 V2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>大小姐植物档案 V2</title>
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      :root {
        --bg: #f5f1e7;
        --bg-soft: #eef3e7;
        --bg-accent: #dde7d7;
        --surface: rgba(255, 251, 246, 0.84);
        --surface-strong: #fffdf8;
        --surface-tint: rgba(240, 246, 235, 0.82);
        --border: rgba(77, 97, 81, 0.12);
        --border-strong: rgba(77, 97, 81, 0.2);
        --text: #203126;
        --text-soft: #536355;
        --shadow-soft: 0 18px 44px rgba(74, 93, 77, 0.09);
        --shadow-float: 0 28px 60px rgba(74, 93, 77, 0.13);
        --radius-xxl: 36px;
        --radius-xl: 28px;
        --radius-lg: 22px;
        --radius-md: 18px;
        --radius-sm: 14px;
        --mono: "SFMono-Regular", "JetBrains Mono", "Fira Code", "Menlo",
          "Consolas", monospace;
        --sans: "Inter", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC",
          sans-serif;
        --cy: #f4ccd7;
        --qh: #8d3e59;
        --hy: #47795e;
        --lr: #86b255;
        --gl: #b4d4a8;
        --gy: #a7afb5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--sans);
        color: var(--text);
        background:
          radial-gradient(circle at 0% 0%, rgba(193, 212, 183, 0.42), transparent 24%),
          radial-gradient(circle at 90% 12%, rgba(211, 228, 202, 0.5), transparent 18%),
          radial-gradient(circle at 50% 100%, rgba(223, 214, 194, 0.48), transparent 22%),
          linear-gradient(180deg, #faf6ef 0%, #f4f1e8 42%, #eef3ea 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(79, 101, 84, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(79, 101, 84, 0.03) 1px, transparent 1px);
        background-size: 26px 26px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.75), transparent 88%);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .page-shell {
        width: min(1380px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 64px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 30px;
        border-radius: var(--radius-xxl);
        border: 1px solid var(--border);
        background:
          linear-gradient(135deg, rgba(255, 252, 246, 0.92), rgba(240, 246, 235, 0.88)),
          linear-gradient(180deg, rgba(255, 255, 255, 0.4), transparent);
        box-shadow: var(--shadow-float);
        backdrop-filter: blur(18px);
      }

      .hero::before,
      .hero::after {
        content: "";
        position: absolute;
        pointer-events: none;
        z-index: 0;
      }

      .hero::before {
        width: 420px;
        height: 420px;
        right: -120px;
        top: -140px;
        border-radius: 45% 55% 48% 52% / 58% 38% 62% 42%;
        background: linear-gradient(160deg, rgba(138, 179, 129, 0.3), rgba(212, 226, 206, 0.05));
        transform: rotate(12deg);
        filter: blur(6px);
      }

      .hero::after {
        width: 320px;
        height: 320px;
        left: -120px;
        bottom: -170px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(198, 215, 191, 0.5), transparent 66%);
      }

      .dashboard-grid,
      .list-toolbar,
      .cards-grid {
        display: grid;
        gap: 18px;
        position: relative;
        z-index: 1;
      }

      .hero-copy-wrap {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        position: relative;
        z-index: 2;
        width: min(62%, 720px);
        min-height: 300px;
        padding: 18px 0 12px;
      }

      .hero-greeting {
        margin: 0;
        color: #5f745f;
        font-size: 15px;
        font-weight: 600;
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 5vw, 60px);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      .hero-subtitle {
        max-width: 520px;
        margin: 0;
        color: var(--text-soft);
        font-size: 15px;
        line-height: 1.65;
      }

      .hero-briefing {
        display: grid;
        gap: 8px;
        max-width: 560px;
        padding: 16px 18px;
        border-radius: 20px;
        background: rgba(255, 253, 248, 0.66);
        border: 1px solid rgba(121, 148, 115, 0.12);
      }

      .hero-briefing-label {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #698067;
      }

      .hero-briefing-copy {
        margin: 0;
        color: var(--text);
        font-size: 15px;
        line-height: 1.7;
      }

      .dashboard-card,
      .plant-card,
      .hero {
        border: 1px solid var(--border);
        background: var(--surface);
        box-shadow: var(--shadow-soft);
        backdrop-filter: blur(18px);
      }

      .dashboard-label,
      .toolbar-title,
      .modal-label {
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--text-soft);
        text-transform: uppercase;
      }

      .hero {
        position: relative;
        overflow: visible;
        border-radius: var(--radius-xxl);
        padding: 26px 30px 24px;
        background:
          radial-gradient(circle at 14% 14%, rgba(184, 218, 173, 0.36), transparent 22%),
          radial-gradient(circle at 86% 12%, rgba(213, 234, 208, 0.42), transparent 24%),
          linear-gradient(180deg, rgba(247, 244, 236, 0.95), rgba(231, 240, 226, 0.92));
      }

      .hero::before,
      .hero::after {
        content: "";
        position: absolute;
        inset: auto;
        border-radius: 50%;
        pointer-events: none;
      }

      .hero::before {
        width: 260px;
        height: 260px;
        right: -54px;
        top: -36px;
        background: rgba(158, 197, 154, 0.16);
      }

      .hero::after {
        width: 210px;
        height: 210px;
        left: 8px;
        bottom: -72px;
        background: rgba(160, 197, 155, 0.14);
      }

      .hero-image-wrap {
        position: relative;
        position: absolute;
        right: -54px;
        top: -8px;
        bottom: auto;
        width: min(46%, 560px);
        height: 320px;
        pointer-events: none;
        z-index: 3;
      }

      .hero-image-wrap::before,
      .hero-image-wrap::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }

      .hero-image-wrap::before {
        inset: 26px auto auto 54px;
        width: 188px;
        height: 240px;
        border-radius: 58% 42% 55% 45% / 64% 38% 62% 36%;
        background: rgba(169, 205, 162, 0.14);
        transform: rotate(-18deg);
      }

      .hero-image-wrap::after {
        left: 96px;
        right: 74px;
        bottom: 42px;
        height: 86px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(120, 151, 111, 0.2), rgba(31, 79, 49, 0) 70%);
        filter: blur(20px);
      }

      .hero-plant-image {
        position: absolute;
        right: 0;
        top: -14px;
        bottom: auto;
        width: min(128%, 620px);
        max-height: 420px;
        object-fit: contain;
        object-position: right top;
        transform: translate(8px, 0) scale(1.1);
        filter:
          contrast(1.04)
          saturate(1.02)
          drop-shadow(0 28px 38px rgba(60, 95, 65, 0.16));
      }

      .dashboard-card {
        padding: 16px 18px;
        border-radius: var(--radius-lg);
      }

      .dashboard-value {
        margin-top: 12px;
        font-size: 31px;
        font-weight: 700;
        line-height: 1;
      }

      .dashboard-note {
        margin-top: 10px;
        color: var(--text-soft);
        font-size: 13px;
        line-height: 1.6;
      }

      .dashboard-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 10px;
        gap: 12px;
      }

      .dashboard-card {
        background: linear-gradient(180deg, rgba(255, 253, 248, 0.94), rgba(238, 245, 233, 0.82));
      }

      .list-toolbar {
        grid-template-columns: 1.5fr 0.95fr;
        align-items: start;
        gap: 16px;
        margin-bottom: 18px;
      }

      .toolbar-title {
        margin: 0 0 10px;
        font-size: 11px;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .filter-chip,
      .sort-select,
      .text-input,
      .text-area,
      .score-input,
      .modal-button,
      .edit-button,
      .cover-action {
        border: 1px solid var(--border);
        color: var(--text);
      }

      .filter-chip {
        appearance: none;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.76);
        font-family: var(--mono);
        font-size: 13px;
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .filter-chip:hover,
      .filter-chip.active {
        transform: translateY(-1px);
        border-color: var(--border-strong);
        background: rgba(232, 241, 227, 0.96);
      }

      .sort-select,
      .text-input,
      .score-input,
      .text-area {
        width: 100%;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.84);
        outline: none;
      }

      .sort-select,
      .text-input,
      .score-input {
        padding: 12px 14px;
      }

      .text-area {
        min-height: 102px;
        padding: 12px 14px;
        resize: vertical;
      }

      .summary-line {
        margin-top: 10px;
        color: var(--text-soft);
        font-size: 13px;
        line-height: 1.5;
      }

      .family-stack {
        display: grid;
        gap: 34px;
        margin-top: 32px;
      }

      .family-section {
        display: grid;
        gap: 22px;
      }

      .family-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 18px;
        margin-bottom: 0;
      }

      .family-title-wrap {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-width: 0;
      }

      .family-title-group {
        display: grid;
        gap: 6px;
        min-width: 0;
      }

      .family-code {
        flex: 0 0 auto;
        padding: 8px 12px;
        border-radius: 14px;
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 700;
        color: #243127;
      }

      .family-title {
        margin: 0;
        font-size: 24px;
        line-height: 1.12;
      }

      .family-subtitle {
        margin-top: 4px;
        color: var(--text-soft);
        font-size: 14px;
      }

      .family-count {
        flex: 0 0 auto;
        padding: 8px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.76);
        border: 1px solid var(--border);
        font-family: var(--mono);
        color: var(--text-soft);
        font-size: 13px;
      }

      .cards-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }

      .plant-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 20px;
        border-radius: 24px;
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .plant-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 30px 56px rgba(71, 92, 74, 0.15);
        border-color: rgba(77, 97, 81, 0.18);
      }

      .plant-card.highlight {
        border-color: rgba(107, 150, 99, 0.48);
        box-shadow: 0 0 0 4px rgba(136, 182, 122, 0.16), 0 26px 52px rgba(71, 92, 74, 0.14);
      }

      .plant-card::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background: var(--family-color, #afcfa0);
      }

      .cover-area {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 10;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(77, 97, 81, 0.08);
        background:
          radial-gradient(circle at top right, rgba(255, 255, 255, 0.58), transparent 30%),
          linear-gradient(180deg, rgba(220, 236, 212, 0.9), rgba(202, 223, 195, 0.72));
      }

      .cover-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .cover-button {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        padding: 16px;
        border: 0;
        background: linear-gradient(180deg, rgba(33, 50, 38, 0.04), rgba(33, 50, 38, 0.26));
        color: #f5f9f3;
      }

      .cover-button.no-image {
        align-items: center;
        justify-content: center;
        color: var(--text-soft);
        background: transparent;
      }

      .cover-placeholder {
        display: grid;
        justify-items: center;
        gap: 10px;
        text-align: center;
      }

      .cover-placeholder svg {
        width: 42px;
        height: 42px;
        opacity: 0.75;
      }

      .cover-placeholder span {
        font-size: 14px;
        font-weight: 600;
      }

      .cover-placeholder small,
      .cover-meta,
      .cover-action-text {
        color: var(--text-soft);
      }

      .cover-button.has-image .cover-action-text,
      .cover-button.has-image .cover-meta {
        color: rgba(245, 249, 243, 0.88);
      }

      .cover-caption {
        display: grid;
        gap: 6px;
      }

      .cover-meta {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .cover-action {
        align-self: flex-end;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: flex-start;
      }

      .card-top-left {
        display: grid;
        gap: 12px;
        min-width: 0;
        flex: 1 1 auto;
      }

      .card-top-right {
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        gap: 10px;
        flex: 0 0 auto;
        flex-wrap: wrap;
      }

      .plant-id {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        padding: 6px 10px;
        border-radius: 10px;
        background: rgba(36, 49, 39, 0.08);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .family-tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--family-color, #afcfa0);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        color: #243127;
      }

      .edit-button {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1;
      }

      .plant-name {
        margin: 0;
        font-size: 24px;
        line-height: 1.24;
        word-break: break-word;
      }

      .score-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 2px;
      }

      .score-pill {
        padding: 7px 10px;
        border-radius: 10px;
        background: rgba(36, 49, 39, 0.08);
        font-family: var(--mono);
        font-size: 12px;
        white-space: nowrap;
      }

      .score-meter {
        position: relative;
        flex: 1;
        height: 10px;
        border-radius: 999px;
        background: rgba(84, 102, 83, 0.12);
        overflow: hidden;
      }

      .score-meter-bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: calc(var(--score, 0) * 10%);
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(120, 151, 111, 0.45), var(--family-color, #afcfa0));
      }

      .kv-list {
        display: grid;
        gap: 10px;
        margin-top: 2px;
      }

      .kv-row {
        display: grid;
        grid-template-columns: 104px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        padding-top: 10px;
        border-top: 1px dashed rgba(72, 89, 70, 0.12);
      }

      .kv-row:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .kv-key {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-soft);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .kv-value {
        font-size: 14px;
        line-height: 1.7;
      }

      .empty-state {
        padding: 44px 24px;
        border-radius: 24px;
        border: 1px dashed var(--border-strong);
        color: var(--text-soft);
        text-align: center;
        background: rgba(255, 255, 255, 0.54);
      }

      .modal-shell {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: rgba(27, 39, 31, 0.34);
        backdrop-filter: blur(10px);
      }

      .modal-shell.open {
        display: flex;
      }

      .modal-panel {
        width: min(680px, 100%);
        max-height: calc(100vh - 36px);
        overflow: auto;
        padding: 24px;
        border-radius: 28px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(255, 252, 247, 0.98), rgba(239, 245, 234, 0.94));
        box-shadow: 0 32px 64px rgba(25, 39, 29, 0.22);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-start;
        margin-bottom: 20px;
      }

      .modal-title {
        margin: 8px 0 6px;
        font-size: 28px;
      }

      .modal-subtitle {
        color: var(--text-soft);
        font-size: 14px;
        line-height: 1.6;
      }

      .modal-grid {
        display: grid;
        gap: 14px;
      }

      .modal-field {
        display: grid;
        gap: 8px;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }

      .modal-button {
        padding: 11px 16px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.82);
      }

      .modal-button.primary {
        background: linear-gradient(180deg, #395644, #476c56);
        color: #eef5ec;
        border-color: rgba(57, 86, 68, 0.9);
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        z-index: 30;
        transform: translate(-50%, 20px);
        min-width: 240px;
        max-width: calc(100vw - 32px);
        padding: 13px 16px;
        border-radius: 14px;
        background: rgba(32, 49, 38, 0.92);
        color: #f0f6ee;
        text-align: center;
        font-size: 14px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 1160px) {
        .hero-grid,
        .dashboard-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .list-toolbar,
        .cards-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

      }

      @media (max-width: 860px) {
        .page-shell {
          width: min(100vw - 20px, 1380px);
          padding-top: 20px;
        }

        .hero {
          padding: 18px;
        }

        .dashboard-grid,
        .list-toolbar,
        .cards-grid {
          grid-template-columns: 1fr;
        }

        .hero-copy-wrap {
          width: 100%;
          min-height: auto;
          padding: 0;
          padding-right: 0;
        }

        .hero-image-wrap {
          position: relative;
          right: auto;
          top: auto;
          bottom: auto;
          width: 100%;
          height: 240px;
          margin-top: 8px;
        }

        .hero-plant-image {
          width: min(100%, 360px);
          max-height: 250px;
          right: 8px;
          top: auto;
          bottom: -4px;
          transform: translate(0, 0) scale(1.03);
          object-position: right bottom;
        }

        .family-header,
        .modal-header,
        .card-top {
          flex-direction: column;
        }

        .family-header {
          gap: 14px;
        }

        .family-title-wrap {
          gap: 14px;
        }

        .family-count {
          margin-top: 2px;
        }

        .family-section {
          gap: 24px;
        }

        .card-top-right {
          width: 100%;
          justify-content: space-between;
        }

        .score-row {
          flex-wrap: wrap;
        }

        .plant-name {
          font-size: 22px;
        }

        .kv-row {
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <div class="hero-copy-wrap">

      function getStorageOverrides() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (error) {
          console.warn("Failed to read local storage", error);
          return {};
        }
      }

      function loadPlants() {
        const overrides = getStorageOverrides();
        return defaultPlants.map((plant) => ({
          ...plant,
          ...(overrides[plant.id] || {})
        }));
      }

      function persistPlantOverride(plantId, patch) {
        const overrides = getStorageOverrides();
        overrides[plantId] = {
          ...(overrides[plantId] || {}),
          ...patch
        };

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(overrides));
          return true;
        } catch (error) {
          console.error("Failed to persist plant override", error);
          showToast("保存失败，可能是图片过大或浏览器存储空间不足。");
          return false;
        }
      }

      function updatePlant(plantId, patch) {
        const nextPlants = state.plants.map((plant) =>
          plant.id === plantId ? { ...plant, ...patch } : plant
        );

        if (!persistPlantOverride(plantId, patch)) {
          return;
        }

        state.plants = nextPlants;
        render();
      }

      function getFilteredPlants() {
        const filtered =
          state.family === "ALL"
            ? state.plants
            : state.plants.filter((plant) => plant.code === state.family);

        return [...filtered].sort((a, b) =>
          state.sort === "desc" ? b.score - a.score : a.score - b.score
        );
      }

      function getDashboardMetrics() {
        const watchPlants = [...state.plants]
          .filter((plant) => plant.score <= 8.8)
          .sort((a, b) => a.score - b.score);
        const duePlants = [...state.plants]
          .filter((plant) => plant.score <= 9.0)
          .sort((a, b) => a.score - b.score);
        const watchList = watchPlants.length;
        const checkToday = duePlants.length;
        const avgScore =
          state.plants.reduce((sum, plant) => sum + Number(plant.score), 0) /
          state.plants.length;
        const highest = [...state.plants].sort((a, b) => b.score - a.score)[0];
        const lowest = [...state.plants].sort((a, b) => a.score - b.score)[0];

        return {
          duePlants,
          watchPlants,
          watchList,
          checkToday,
          avgScore,
          highest,
          lowest
        };
      }

      async function compressImageToBase64(file) {
        const dataUrl = await readFileAsDataUrl(file);
        const image = await loadImage(dataUrl);
        const ratio = image.width > 800 ? 800 / image.width : 1;
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(image.width * ratio);
        canvas.height = Math.round(image.height * ratio);
        const context = canvas.getContext("2d");
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", 0.86);
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function loadImage(source) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = source;
        });
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 2200);
      }

      function render() {
        renderDashboard();
        renderFilters();
        renderPlants();
      }

      sortSelect.addEventListener("change", (event) => {
        state.sort = event.target.value;
        render();
      });

      coverInput.addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file || !state.uploadTargetId) {
          return;
        }

        try {
          const cover = await compressImageToBase64(file);
          updatePlant(state.uploadTargetId, { cover });
          showToast("封面图已更新并保存到本地。");
        } catch (error) {
          console.error("Failed to process image", error);
          showToast("图片处理失败，请换一张图片再试。");
        } finally {
          coverInput.value = "";
          state.uploadTargetId = null;
        }
      });

      editForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!state.editingId) return;

        const nextScore = Math.min(10, Math.max(0, Number(editScore.value)));
        if (Number.isNaN(nextScore)) {
          showToast("请输入有效的状态评分。");
          return;
        }

        updatePlant(state.editingId, {
          score: Number(nextScore.toFixed(1)),
          stage: editStage.value.trim(),
          focus: editFocus.value.trim(),
          note: editNote.value.trim()
        });
        closeEditModal();
        showToast("植物档案已保存到本地。");
      });

      document.getElementById("closeModalButton").addEventListener("click", closeEditModal);
      document.getElementById("cancelModalButton").addEventListener("click", closeEditModal);

      editModal.addEventListener("click", (event) => {
        if (event.target === editModal) {
          closeEditModal();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && state.editingId) {
          closeEditModal();
        }
      });

      render();
    </script>
  </body>
</html>
